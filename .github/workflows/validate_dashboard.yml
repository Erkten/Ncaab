name: Validate dashboard Python files
on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: python -m py_compile app.py dashboard_launcher.py
